name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: 后端（编译 + 迁移可执行）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r apps/api/requirements.txt
      - name: 语法检查
        run: python -m compileall -q apps/api/app apps/api/main.py
      - name: 检查迁移脚本可加载
        working-directory: apps/api
        run: |
          alembic heads
          alembic history | head -20

  web:
    name: 前端（类型 + lint + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        working-directory: apps/web
        run: npm ci
      - name: 类型检查
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: 构建
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE=
          cache-from: type=gha
          cache-to: type=gha,mode=max